name: Reminder Trigger

on:
  schedule:
    - cron: '0 22 * * *'  # 每天 UTC 22:00 = 台北 06:00
  workflow_dispatch:      # 手動執行

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminder API
        run: curl --fail --retry 3 --max-time 60 https://captain-chatbot.vercel.app/trigger_reminder
